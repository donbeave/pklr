name: ci

# ruxel-5.2.3 is Ruxel's deployment branch: the published 5.2.3 crate plus
# Ruxel's patches (see donbeave/pklr#11). The published crate has no reqwest
# or package-zip feature and no integration test target, so the steps for
# them exist only on main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "ruxel-5.2.3"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --no-default-features --features native-io
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Embedders build the evaluator without host IO, where items only those
      # features use are dead. The examples and tests need native-io.
      - run: cargo clippy --lib --no-default-features --features eval-core -- -D warnings
      - run: cargo fmt --check
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-features --lib file_uri_path_preserves_unc_authority
      - run: cargo test --all-features --test pkl_features encoded_file_uris_resolve_amends_imports_and_extends
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: cargo msrv verify
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline below is the merge commit's base-branch parent.
          fetch-depth: 0
          persist-credentials: false
      # Compares with the base branch rather than the last release, so a pull
      # request is judged on its own changes and not on breaking changes that
      # already landed on main ahead of a release. The checkout is the
      # synthetic merge commit, and its first parent is the base it was merged
      # onto; the event's base.sha can be older than that.
      - name: Check for breaking API changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '!:')
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: HEAD^1
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise x hk -- hk check --all
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
  final:
    needs: [test, windows, msrv, semver, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check CI job results
        run: |
          results=("${{ needs.test.result }}" "${{ needs.windows.result }}" "${{ needs.msrv.result }}" "${{ needs.semver.result }}" "${{ needs.lint.result }}")
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              echo "CI job failed or was skipped"
              exit 1
            fi
          done
